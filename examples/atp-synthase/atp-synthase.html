<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ATP synthase</title><style>
.iso{
  --microscope-page:#0b0b0b;--microscope-card:#131313;--microscope-text:#a3a3a3;--microscope-strong:#e6e6e6;--microscope-muted:#6e6e6e;
  --microscope-paper:#131313;--microscope-face:#1b1b1b;--microscope-top:#1c1c1c;
  --microscope-shade-0:#0f0f0f;--microscope-shade-1:#121212;--microscope-shade-2:#151515;--microscope-shade-3:#181818;
  --microscope-lit-top:#262626;--microscope-lit-shade:#1d1d1d;
  --microscope-hi:#d4d4d4;--microscope-mid:#6a6a6a;--microscope-lo:#3e3e3e;--microscope-faint:#2a2a2a;--microscope-lit:#ffffff;
  --microscope-halo:#050505;--microscope-halo-opacity:.9;--microscope-dot:#e6e6e6;
  --microscope-red:#ff6b6b;--microscope-green:#6be0a0;--microscope-blue:#6b9bff;
  --microscope-weight:.6px;--microscope-ease:cubic-bezier(.32,.72,0,1);
  --microscope-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --microscope-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --microscope-page:#f2f2ef;--microscope-card:#fbfbfa;--microscope-text:#57575a;--microscope-strong:#18181a;--microscope-muted:#8c8c90;
  --microscope-paper:#fbfbfa;--microscope-face:#ffffff;--microscope-top:#ffffff;
  --microscope-shade-0:#dcdcd9;--microscope-shade-1:#e5e5e2;--microscope-shade-2:#ededea;--microscope-shade-3:#f4f4f1;
  --microscope-lit-top:#ffffff;--microscope-lit-shade:#eeeeeb;
  --microscope-hi:#26262a;--microscope-mid:#8a8a8f;--microscope-lo:#b4b4b8;--microscope-faint:#d4d4d6;--microscope-lit:#000000;
  --microscope-halo:#8a8a80;--microscope-halo-opacity:.32;--microscope-dot:#3a3a3e;
  --microscope-red:#e5484d;--microscope-green:#30a46c;--microscope-blue:#3e63dd;
  --microscope-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--microscope-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--microscope-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--microscope-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--microscope-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--microscope-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--microscope-shade-3)}
.iso-top{fill:var(--microscope-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--microscope-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--microscope-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--microscope-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--microscope-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--microscope-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--microscope-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--microscope-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--microscope-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--microscope-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--microscope-lit)}
.iso-halo{fill:var(--microscope-halo);stroke:none;filter:blur(9px);opacity:var(--microscope-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--microscope-lo);stroke-width:var(--microscope-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--microscope-hi)}
.iso-line[data-tone="mid"]{stroke:var(--microscope-mid)}
.iso-line[data-tone="lo"]{stroke:var(--microscope-lo)}
.iso-line[data-tone="faint"]{stroke:var(--microscope-faint)}
.iso-line[data-tone="lit"]{stroke:var(--microscope-lit)}
.iso-line[data-tone="red"]{stroke:var(--microscope-red)}
.iso-line[data-tone="green"]{stroke:var(--microscope-green)}
.iso-line[data-tone="blue"]{stroke:var(--microscope-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--microscope-paper);stroke:var(--microscope-lo);stroke-width:var(--microscope-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--microscope-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--microscope-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--microscope-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--microscope-lit)}
.iso-dots circle{fill:var(--microscope-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--microscope-mid);font-family:var(--microscope-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--microscope-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--microscope-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--microscope-faint)}
.tb-body{fill:var(--microscope-shade-2);stroke:none}
.tb-shine{fill:var(--microscope-top);stroke:none}
.tb-shade{fill:var(--microscope-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--microscope-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--microscope-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--microscope-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--microscope-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--microscope-card);box-shadow:0 0 0 1px var(--microscope-mid);--microscope-paper:var(--microscope-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--microscope-muted);font-family:var(--microscope-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--microscope-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--microscope-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--microscope-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--microscope-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--microscope-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--microscope-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--microscope-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--microscope-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--microscope-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--microscope-blue)}
.iso-swatch-crease{stroke:var(--microscope-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--microscope-page);color:var(--microscope-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

hlbrandt 2019, Annu Rev Biochem 88:515; Noji et al. 1997, Nature 386:299; Diez et al. 2004, Nat Struct Mol Biol 11:135.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;

.tb-shade{fill:var(--microscope-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--microscope-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--microscope-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--microscope-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--microscope-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--microscope-card);box-shadow:0 0 0 1px var(--microscope-mid);--microscope-paper:var(--microscope-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--microscope-muted);font-family:var(--microscope-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--microscope-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--microscope-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--microscope-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--microscope-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--microscope-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--microscope-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--microscope-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--microscope-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--microscope-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--microscope-blue)}
.iso-swatch-crease{stroke:var(--microscope-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

const SLOWER = Math.round(((DWELL_S + STEP_S) * REV_PER_S * C_SUBUNITS) / 10) * 10;
const NM = 6;

const SOURCES = [
  { value: "c-ring of 8 c subunits; 8 H+ and 3 ATP per turn; about 2.7 H+ per ATP; about 100 turns per second", source: "Watt et al. 2010, PNAS 107:16823" },
  { value: "F1 head α3β3 about 11 nm across, facing the matrix; three domains per α and β", source: "Abrahams et al. 1994, Nature 370:621" },
  { value: "γ turns in 120° steps, one ATP per step", source: "Yasuda et al. 1998, Cell 93:1117" },
  { value: "peripheral stalk of one b subunit with d, F6 and OSCP", source: "Rees et al. 2009, PNAS 106:21597" },
  { value: "protons enter from the intermembrane space through one a-subunit half-channel and leave into the matrix through the other", source: "Kühlbrandt 2019, Annu Rev Biochem 88:515" },
  { value: "synthesis turns the rotor opposite to hydrolysis: anticlockwise seen from F1", source: "Noji et al. 1997, Nature 386:299; Diez et al. 2004, Nat Struct Mol Biol 11:135" },
];

function seeded(seed) {
  let state = seed >>> 0;
  return () => {
    state = (state + 0x6d2b79f5) >>> 0;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const dwellOf = (rand, scale = 1) => Math.min(2.2, Math.max(0.22, -Math.log(1 - rand()) * DWELL_S * scale));

const atpOf = (turned) => Math.floor(turned / ATP_DEG + 1e-6);

const protonsOf = (turned) => Math.floor(turned / STEP_DEG + 0.5 + 1e-6);

function readoutOf(turned) {
  return `${protonsOf(turned)} H⁺ · ${Math.round(turned)}° · ${atpOf(turned)} ATP · ${SLOWER}× slower`;
}

const VIEW_DEG = 40;
const RING = { n: 8, rc: 12, rs: 4.4, z0: 36, z1: 74 };
const RING_R = RING.rc + RING.rs;
const FOOT = { r: 10, z: RING.z1, h: 4 };
const SHAFT = { r: 4, z: FOOT.z + FOOT.h, top: 132 };
const DE = { r: 3.6, off: SHAFT.r + 3.6, z: FOOT.z + FOOT.h, h: 12, at: 20 };
const SITE = { z: 55, r: RING_R - 0.6 };
const ASUB = { angle: 130, span: 34, r0: RING_R, r1: RING_R + 13, z0: 34, z1: 76 };
const OUTLET = { angle: ASUB.angle + 28, r: (ASUB.r0 + ASUB.r1) / 2, z: ASUB.z1 };
const INLET = { angle: ASUB.angle - ASUB.span, r: (ASUB.r0 + ASUB.r1) / 2, z: 38.5 };
const HOLE_R = 1.7;

const RAD = Math.PI / 180;
const wrapDeg = (deg) => ((((deg + 180) % 360) + 360) % 360) - 180;
const polar = (r, deg, z = 0) => [r * Math.cos(deg * RAD), r * Math.sin(deg * RAD), z];

function protonated(phi) {
  const rel = wrapDeg(phi - ASUB.angle);
  const half = 180 / RING.n;
  return rel <= -half || rel >= half;
}

function backSlot(phi) {
  const rel = wrapDeg(phi - ASUB.angle);
  return Math.cos((phi - VIEW_DEG) * RAD) < 0 || (rel >= -ASUB.span && rel <= ASUB.span);
}

function rotorSvg(theta, P, K, sprite) {
  const back = [];
  const front = [];
  const depth = (point) => K.depthOf(point, P);
  for (let index = 0; index < RING.n; index++) {
    const phi = theta + (index * 360) / RING.n;
    const [x, y] = polar(RING.rc, phi);
    const slot = backSlot(phi) ? back : front;
    slot.push({ d: depth([x, y, SITE.z]), svg: K.solidSvg(K.cylinder(x, y, RING.rs, RING.z0, RING.z1 - RING.z0, P, 28), { tone: "hi", lit: true }) });
    if (protonated(phi)) {
      const site = polar(SITE.r, phi, SITE.z);
      slot.push({ d: depth(site) + 0.05, svg: sprite(site) });
    }
  }
  const order = (list) => list.sort((a, b) => a.d - b.d).map((entry) => entry.svg).join("");
  const [ex, ey] = polar(DE.off, theta + DE.at);
  const top = [
    { d: depth([0, 0, DE.z]), svg: K.solidSvg(K.cylinder(0, 0, SHAFT.r, SHAFT.z, SHAFT.top - SHAFT.z, P, 24), { tone: "hi", lit: true }) },
    { d: depth([ex, ey, DE.z]), svg: K.solidSvg(K.cylinder(ex, ey, DE.r, DE.z, DE.h, P, 24), { tone: "hi", lit: true }) },
  ];
  return {
    back: order(back),
    front: order(front) + K.solidSvg(K.cylinder(0, 0, FOOT.r, FOOT.z, FOOT.h, P, 40), { tone: "hi", lit: true }) + order(top),
  };
}

const P = DATA.P;
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const figure = stage.closest(".iso-figure");
const layer = (name) => svg.querySelector(`[data-live="${name}"]`);
const rotorBack = layer("rotor-back");
const rotorFront = layer("rotor-front");
const imsLayer = layer("ims");
const matrixLayer = layer("matrix");
const atpBehind = layer("atp-behind");
const atpFront = layer("atp-front");
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const K = { cylinder, solidSvg, depthOf };
const REST_S = 2.4;
const QUEUE = 3;
const TOUR = RING.n;
const BETAS = DATA.LOBES.filter((lobe) => lobe.kind === "beta").map((lobe) => lobe.angle).sort((a, b) => b - a);
const rand = seeded(7);

const place = (point, markup, alpha = 1) => `<g transform="${translateAlong(P, point)}"${alpha < 0.999 ? ` opacity="${Math.max(0, alpha).toFixed(3)}"` : ""}>${markup}</g>`;
const ease = (t) => t * t * (3 - 2 * t);
const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const HOLE_IN = polar(INLET.r, INLET.angle, INLET.z);
const NORMAL_IN = polar(1, INLET.angle - 90);
const queueAt = (slot) => [HOLE_IN[0] + NORMAL_IN[0] * (6 + slot * 6.5), HOLE_IN[1] + NORMAL_IN[1] * (6 + slot * 6.5) + slot * 2.4, INLET.z - 5 - slot * 4.2];

let theta = DATA.THETA0;
let target = DATA.THETA0;
let rate = 0;
let crossed = 0;
let released = 0;
let wait = 1.2;
let tourSteps = 0;
let touring = !still.matches;
let driving = false;
let paused = false;
let lit = "";
let visible = false;
let frame = 0;
let last = 0;
let idle = 0;
let transits = [];
let queue = Array.from({ length: QUEUE }, (_, index) => ({ at: index, alpha: 1 }));

function step() {
  target -= STEP_DEG;
  if (queue.length) {
    queue.shift();
    transits.push({ kind: "in", t: 0, dur: STEP_S * 0.55 });
    queue.forEach((proton) => { proton.slot = (proton.slot ?? proton.at) - 1; });
    queue.push({ at: QUEUE, slot: QUEUE - 1, alpha: 0 });
  }
}

function spawnOut() {
  transits.push({ kind: "out", t: 0, dur: 1.6, spin: rand() * 16 - 8 });
}

function spawnAtp(index) {
  transits.push({ kind: "atp", t: 0, dur: 2.6, angle: BETAS[index % BETAS.length] });
}

function draw() {
  const rotor = rotorSvg(theta, P, K, (point) => place(point, DATA.SPRITE_H));
  const dim = lit && lit !== "rotor";
  rotorBack.innerHTML = dim ? rotor.back.replaceAll(' data-lit=""', "") : rotor.back;
  rotorFront.innerHTML = dim ? rotor.front.replaceAll(' data-lit=""', "") : rotor.front;
  const ims = queue.map((proton) => place(queueAt(proton.at), DATA.SPRITE_H, proton.alpha));
  const matrix = [];
  const behind = [];
  const front = [];
  for (const item of transits) {
    const t = Math.min(1, item.t / item.dur);
    if (item.kind === "in") ims.push(place(lerp3(queueAt(0), HOLE_IN, ease(t)), DATA.SPRITE_H, t < 0.6 ? 1 : 1 - (t - 0.6) / 0.4));
    if (item.kind === "out") {
      const point = polar(OUTLET.r + 12 * t, OUTLET.angle + item.spin * t, OUTLET.z + 2 + 24 * ease(t));
      matrix.push(place(point, DATA.SPRITE_H, (t < 0.12 ? t / 0.12 : 1) * (t < 0.55 ? 1 : 1 - (t - 0.55) / 0.45)));
    }
    if (item.kind === "atp") {
      const from = polar(DATA.LOBE.rc + DATA.LOBE.re + 3, item.angle, DATA.LOBE.z + 16);
      const to = polar(DATA.LOBE.rc + DATA.LOBE.re + 24, item.angle + 8, DATA.LOBE.z + 40);
      const markup = place(lerp3(from, to, ease(t)), DATA.SPRITE_ATP, (t < 0.12 ? t / 0.12 : 1) * (t < 0.55 ? 1 : 1 - (t - 0.55) / 0.45));
      (Math.cos(((item.angle - VIEW_DEG) * Math.PI) / 180) >= 0 ? front : behind).push(markup);
    }
  }
  imsLayer.innerHTML = ims.join("");
  matrixLayer.innerHTML = matrix.join("");
  atpBehind.innerHTML = behind.join("");
  atpFront.innerHTML = front.join("");
  const turned = DATA.THETA0 - theta;
  const text = readoutOf(Math.max(0, turned));
  if (readout.textContent !== text) readout.textContent = text;
  stage.setAttribute("aria-valuenow", String(protonsOf(Math.max(0, turned))));
  stage.setAttribute("aria-valuetext", text);
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  const settled = Math.abs(target - theta) < 0.02 && Math.abs(rate) < 0.02;
  if (!paused && (touring || driving)) {
    wait -= dt;
    if (wait <= 0 && settled) {
      step();
      tourSteps += 1;
      wait = STEP_S + dwellOf(rand, driving ? 0.4 : 1);
      if (touring && tourSteps % TOUR === 0) wait += REST_S;
    }
  }
  if (calm) {
    theta = target;
    rate = 0;
  } else {
    const stiff = 220;
    const drag = 2 * Math.sqrt(stiff);
    for (let i = 0; i < 4; i++) {
      rate += ((target - theta) * stiff - rate * drag) * (dt / 4);
      theta += rate * (dt / 4);
    }
    if (Math.abs(target - theta) < 0.01 && Math.abs(rate) < 0.01) {
      theta = target;
      rate = 0;
    }
  }
  const turned = DATA.THETA0 - theta;
  while (crossed < protonsOf(turned)) {
    crossed += 1;
    if (!calm) spawnOut();
  }
  while (released < atpOf(turned)) {
    if (!calm) spawnAtp(released);
    released += 1;
  }
  for (const item of transits) item.t += dt;
  transits = transits.filter((item) => item.t < item.dur);
  for (const proton of queue) {
    const goal = proton.slot ?? proton.at;
    proton.at = calm ? goal : proton.at + (goal - proton.at) * (1 - Math.exp(-dt / 0.25));
    proton.alpha = calm ? 1 : Math.min(1, proton.alpha + dt / 0.6);
  }
  if (calm) transits = [];
  draw();
  const busy = touring || driving || transits.length || theta !== target || queue.some((proton) => proton.alpha < 1 || Math.abs((proton.slot ?? proton.at) - proton.at) > 0.002);
  frame = visible && busy && !paused ? requestAnimationFrame(tick) : 0;
}

const run = () => {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};
const rest = () => {
  clearTimeout(idle);
  idle = setTimeout(() => {
    touring = !still.matches;
    run();
  }, 3600);
};

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}, { rootMargin: "120px 0px" }).observe(stage);

stage.addEventListener("pointerenter", () => {
  touring = false;
  driving = !still.matches;
  clearTimeout(idle);
  run();
});
stage.addEventListener("pointerleave", () => {
  driving = false;
  rest();
});
stage.addEventListener("keydown", (event) => {
  if (event.key === "ArrowRight" || event.key === "ArrowUp") {
    event.preventDefault();
    touring = false;
    if (Math.abs(target - theta) < STEP_DEG * 0.6) step();
    rest();
    run();
  } else if (event.key === " ") {
    event.preventDefault();
    paused = !paused;
    if (paused) touring = false;
    else rest();
    run();
  }
});

function show(part) {
  lit = part;
  figure.querySelectorAll(".it[data-on]").forEach((node) => {
    node.removeAttribute("data-on");
    node.querySelectorAll(".iso-solid[data-shown]").forEach((solid) => {
      solid.removeAttribute("data-lit");
      solid.removeAttribute("data-shown");
    });
  });
  figure.querySelectorAll(".as-key[data-on]").forEach((key) => key.removeAttribute("data-on"));
  if (part) {
    figure.querySelector(`.as-key[data-key="${part}"]`)?.setAttribute("data-on", "");
    if (part !== "rotor") {
      figure.querySelectorAll(`.it[data-part="${part}"]`).forEach((node) => {
        node.setAttribute("data-on", "");
        node.querySelectorAll(".iso-solid:not([data-lit])").forEach((solid) => {
          solid.setAttribute("data-lit", "");
          solid.setAttribute("data-shown", "");
        });
      });
    }
  }
  draw();
}
figure.querySelectorAll(".as-key[data-key]").forEach((key) => {
  const part = key.getAttribute("data-key");
  key.addEventListener("pointerenter", () => show(part));
  key.addEventListener("focus", () => show(part));
  key.addEventListener("pointerleave", () => show(""));
  key.addEventListener("blur", () => show(""));
});
svg.querySelectorAll(".it[data-part]").forEach((node) => {
  const part = node.getAttribute("data-part");
  node.addEventListener("pointerenter", () => show(part));
  node.addEventListener("pointerleave", () => show(""));
});
draw();
</script></body></html>
