.8L592 145.8" stroke-width="3.2"/><path class="bio-leader" d="M443 145.8L592 145.8"/><circle class="bio-anchor" cx="443" cy="145.8" r="1.9"/><text class="bio-label" x="598" y="150" text-anchor="start">Myosin heads</text><path class="bio-casing" d="M380 277.4L415.4 312.7L592 312.7" stroke-width="3.2"/><path class="bio-leader" d="M380 277.4L415.4 312.7L592 312.7"/><circle class="bio-anchor" cx="380" cy="277.4" r="1.9"/><text class="bio-label" x="598" y="316.9" text-anchor="start">M line</text></g><text class="bio-region" x="22" y="24" text-anchor="start">SKELETAL MUSCLE FIBRE, ONE SARCOMERE</text></svg></div><div class="bio-foot"><span>→ contract or relax · space to pause</span><span data-readout>Relaxed · sarcomere 2.50 µm · A band 1.60 µm · I band 0.90 µm · H zone 0.45 µm</span></div></div><figcaption class="iso-legend"><span class="iso-caption">One sarcomere of frog skeletal muscle, the classic vertebrate model. Thin actin filaments, about 1 µm long, are anchored at the Z discs; thick myosin filaments, about 1.6 µm long with a bare zone of about 0.16 µm at the M line, sit between them with their heads pointing away from the middle. When the muscle contracts, myosin heads bind actin and pull the thin filaments toward the M line, so the filaments slide past each other: here the sarcomere shortens from 2.5 to 2.05 µm, the I band and H zone shorten, and the A band, the length of the thick filaments, stays the same. Lengths are to scale; filament widths, spacing and the number of heads are simplified for clarity. Sources: Huxley & Niedergerke 1954, Nature 173:971; Huxley & Hanson 1954, Nature 173:973; Gordon, Huxley & Julian 1966, J Physiol 184:170.</span></figcaption></figure></div></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");

  const [, ty] = iso([base[0], base[1], base[2] + length], P);
  const w = r * k;
  const d = `M${r1(bx - w)} ${r1(ty)}L${r1(bx - w)} ${r1(by)}A${r1(w)} ${r1(w)} 0 0 0 ${r1(bx + w)} ${r1(by)}L${r1(bx + w)} ${r1(ty)}A${r1(w)} ${r1(w)} 0 0 0 ${r1(bx - w)} ${r1(ty)}Z`;

function smoothPath(points, closed = false) {
  if (points.length < 2) return "";
  const at = (index) => points[closed ? (index + points.length) % points.length : Math.max(0, Math.min(points.length - 1, index))];
  let d = `M${r1(points[0][0])} ${r1(points[0][1])}`;
  const count = closed ? points.length : points.length - 1;
  for (let i = 0; i < count; i++) {
    const p0 = at(i - 1);
    const p1 = at(i);
    const p2 = at(i + 1);
    const p3 = at(i + 2);
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${r1(c1[0])} ${r1(c1[1])} ${r1(c2[0])} ${r1(c2[1])} ${r1(p2[0])} ${r1(p2[1])}`;

function cell(P, centre, across, tall, swatch, { radius = Math.min(across, tall) * 0.35, extra = "" } = {}) {

  const w = (across * k) / 2;
  const h = (tall * k * cosE) / 2;
  const r = Math.min(radius * k, w, h);
  const d = `M${r1(x - w + r)} ${r1(y - h)}L${r1(x + w - r)} ${r1(y - h)}Q${r1(x + w)} ${r1(y - h)} ${r1(x + w)} ${r1(y - h + r)}L${r1(x + w)} ${r1(y + h - r)}Q${r1(x + w)} ${r1(y + h)} ${r1(x + w - r)} ${r1(y + h)}L${r1(x - w + r)} ${r1(y + h)}Q${r1(x - w)} ${r1(y + h)} ${r1(x - w)} ${r1(y + h - r)}L${r1(x - w)} ${r1(y - h + r)}Q${r1(x - w)} ${r1(y - h)} ${r1(x - w + r)} ${r1(y - h)}Z`;

function rope(P, points3, r, swatch) {

    `<path d="${d}" fill="none" stroke="var(--bio-${swatch}-edge)" stroke-width="${r1(w + 1.8)}" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<path d="${d}" fill="none" stroke="var(--bio-${swatch})" stroke-width="${r1(w)}" stroke-linecap="round" stroke-linejoin="round"/>` +
    `<path d="${d}" fill="none" stroke="var(--bio-${swatch}-hi)" stroke-width="${r1(w * 0.32)}" stroke-linecap="round" stroke-linejoin="round" opacity=".75" transform="translate(${r1(-w * 0.16)} ${r1(-w * 0.12)})"/>`

function head(direction, tip, size) {
  const angle = Math.atan2(direction[1], direction[0]);

  const side = [Math.cos(angle + Math.PI / 2) * size * 0.42, Math.sin(angle + Math.PI / 2) * size * 0.42];
  return `M${r1(tip[0])} ${r1(tip[1])}L${r1(back[0] + side[0])} ${r1(back[1] + side[1])}L${r1(back[0] - side[0])} ${r1(back[1] - side[1])}Z`;

const unit2 = (v) => {

function arrowParts(d, tip, direction, { flow, size, tail }) {

  return `<path class="bio-casing" d="${d}" stroke-width="${r1(width + 2.6)}"/><path class="bio-casing" d="${heads}" stroke-width="2.4"/><path class="bio-arrow"${attr} d="${d}"/><path class="bio-arrow-head"${attr} d="${heads}"/>`;

function arrow(points, { flow = false, size = 7.5, both = false, bend = null, tone = null } = {}) {

    const mid = [(from[0] + to[0]) / 2, (from[1] + to[1]) / 2];
    const normal = unit2([-(to[1] - from[1]), to[0] - from[0]]);
    const control = [mid[0] + normal[0] * bend, mid[1] + normal[1] * bend];
    const endDir = unit2([to[0] - control[0], to[1] - control[1]]);
    const end = [to[0] - endDir[0] * size * 0.7, to[1] - endDir[1] * size * 0.7];

  trimmed[n - 1] = [points[n - 1][0] - endDir[0] * size * 0.7, points[n - 1][1] - endDir[1] * size * 0.7];

    const startDir = unit2([points[0][0] - points[1][0], points[0][1] - points[1][1]]);

function rotationArrow(P, centre, radius, from, to, { size = 7, steps = 64 } = {}) {

    const point = iso([centre[0] + radius * Math.cos(angle * RAD), centre[1] + radius * Math.sin(angle * RAD), centre[2]], P);
    (Math.cos((angle - view) * RAD) < 0 ? back : front).push(point);

  if (t < 3.8) return ease((t - 1.2) / 2.6);
  if (t < 5.2) return 1;
  return 1 - ease((t - 5.2) / 2.8);
}

function bandsAt(time) {
  const sl = SL_RELAXED + (SL_CONTRACTED - SL_RELAXED) * contractionAt(time);
  return { sl, a: THICK_UM, i: sl - THICK_UM, h: Math.max(0, sl - THIN_SPAN_UM) };
}

function readoutOf(time) {
  const t = ((time % CYCLE_S) + CYCLE_S) % CYCLE_S;
  const phase = PHASES.find((p) => t >= p.from && t < p.to) ?? PHASES[0];
  const b = bandsAt(time);
  return `${phase.name} · sarcomere ${b.sl.toFixed(2)} µm · A band ${b.a.toFixed(2)} µm · I band ${b.i.toFixed(2)} µm · H zone ${b.h.toFixed(2)} µm`;
}


const UM = 100;
const WINDOW = 190;
const THIN_ROWS = [75, 25, -25, -75];
const THICK_ROWS = [50, 0, -50];

const f1 = (v) => v.toFixed(1);

function thinSvg(P, B, x0, x1, z) {
  const a = B.iso([x0, 0, z], P);
  const b = B.iso([x1, 0, z], P);
  const k = B.screenScale(P);
  const line = (dz) => `M${f1(a[0])} ${f1(a[1] - dz * k)}L${f1(b[0])} ${f1(b[1] - dz * k)}`;
  const bead = 3.4 * k;
  const pitch = 6.4 * k;
  const strand = (dz, phase) =>
    `<path d="${line(dz)}" fill="none" stroke="var(--bio-actin-edge)" stroke-width="${f1(bead + 1.2)}" stroke-linecap="round" stroke-dasharray="0 ${f1(pitch)}" stroke-dashoffset="${f1(phase)}"/>` +
    `<path d="${line(dz)}" fill="none" stroke="var(--bio-actin)" stroke-width="${f1(bead)}" stroke-linecap="round" stroke-dasharray="0 ${f1(pitch)}" stroke-dashoffset="${f1(phase)}"/>`;
  return `<path class="bio-thin" d="${line(0)}" fill="none" stroke="var(--bio-actin-lo)" stroke-width="${f1(1.2 * k)}"/>` + strand(1.6, 0) + strand(-1.6, pitch / 2);
}

function headSvg(P, B, x, z, side, toward, tilt) {
  const k = B.screenScale(P);
  const [cx, cy] = B.iso([x + toward * 3, 0, z + side * 9], P);
  const angle = -side * toward * (55 - tilt);
  return `<ellipse class="bio-body" data-swatch="myosin" cx="${f1(cx)}" cy="${f1(cy)}" rx="${f1(5.2 * k)}" ry="${f1(2.6 * k)}" transform="rotate(${f1(angle)} ${f1(cx)} ${f1(cy)})" fill="url(#bio-r-myosin)"/>`;
}

function thickSvg(P, B, centre, z, cycling, time, anchor) {
  const half = (1.6 * UM) / 2;
  const bare = (0.16 * UM) / 2;
  const out = [B.rope(P, [[centre - half, 0, z], [centre + half, 0, z]], 6, "myosin")];
  let index = 0;
  for (const toward of [-1, 1]) {
    for (let d = bare + 4; d <= half - 3; d += 10.5) {
      for (const side of [1, -1]) {
        const x = centre + toward * d;
        const tilt = cycling * 22 * (0.5 + 0.5 * Math.sin(time * 7 + index * 1.7));
        out.push(headSvg(P, B, x, z, side, toward, tilt));
        if (anchor && toward === 1 && side === 1 && Math.abs(d - 52) < 5.5) anchor.head = B.iso([x + toward * 3, 0, z + side * 9], P);
        index++;
      }
    }
  }
  return out.join("");
}

function zdiscSvg(P, B, x) {
  const points = [];
  for (let z = 96, i = 0; z >= -96; z -= 12, i++) points.push([x + (i % 2 ? 3.5 : -3.5), 0, z]);
  return B.rope(P, points, 2.3, "zdisc");
}

function sarcomereSvg(time, P, B, { L, R }) {
  const bands = bandsAt(time);
  const c = contractionAt(time);
  const tt = ((time % CYCLE_S) + CYCLE_S) % CYCLE_S;
  const cycling = tt >= 1.2 && tt < 5.2 ? Math.min(1, c * 4 + (tt < 3.8 ? 0.4 : 0)) : 0;
  const sl = bands.sl * UM;
  const thin = THIN_UM * UM;
  const half = (THICK_UM * UM) / 2;
  const zds = [-1.5, -0.5, 0.5, 1.5].map((n) => n * sl).filter((x) => Math.abs(x) < WINDOW + thin);
  const art = [];
  for (const z of THIN_ROWS) {
    for (const xz of zds) {
      const from = Math.max(-WINDOW - 20, xz - thin);
      const to = Math.min(WINDOW + 20, xz + thin);
      if (to > from) art.push(thinSvg(P, B, from, to, z));
    }
  }
  const anchor = {};
  for (const centre of [-sl, 0, sl]) {
    for (const z of THICK_ROWS) {
      if (centre - half > WINDOW + 20 || centre + half < -WINDOW - 20) continue;
      art.push(thickSvg(P, B, centre, z, cycling, time, centre === 0 && z === THICK_ROWS[0] ? anchor : null));
    }
  }
  for (const xz of zds) if (Math.abs(xz) < WINDOW + 10) art.push(zdiscSvg(P, B, xz));
  art.push(B.rope(P, [[0, 0, 62], [0, 0, -62]], 1.3, "zdisc"));
  const at = (p) => B.iso(p, P);
  const left = -sl / 2;
  const right = sl / 2;
  const y = (z) => at([0, 0, z])[1];
  const x = (v) => at([v, 0, 0])[0];
  const dims = [
    B.dimension([x(left), y(140)], [x(right), y(140)], `Sarcomere ${bands.sl.toFixed(2)} µm`, { offset: 0 }),
    B.dimension([x(-half), y(118)], [x(half), y(118)], `A band ${bands.a.toFixed(2)} µm`, { offset: 0 }),
    bands.h > 0.04 ? B.dimension([x(-bands.h * UM / 2), y(98)], [x(bands.h * UM / 2), y(98)], `H zone`, { offset: 0 }) : "",
    B.dimension([x(left + bands.i * UM / 2), y(-112)], [x(left - bands.i * UM / 2), y(-112)], `I band ${bands.i.toFixed(2)} µm`, { offset: 0 }),
  ];
  const labels = [
    B.label("Z disc", at([left + 3.5, 0, -84]), { side: "left", x: L }),
    B.label("Thin filament (actin)", at([left + 40, 0, 25]), { side: "left", x: L }),
    B.label("Thick filament (myosin)", at([-half + 10, 0, -50 + 5.5]), { side: "left", x: L }),
    B.label("Myosin heads", anchor.head, { side: "right", x: R }),
    B.label("M line", at([0, 0, -60]), { side: "right", x: R, drop: y(-92) - at([0, 0, -60])[1] }),
  ];
  return { art: art.join(""), annotations: dims.join("") + labels.join("") };
}

const P = DATA.P;
const B = { rope, label, dimension, smoothPath, screenScale, iso, depthOf, cameraOf };
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const artLayer = svg.querySelector('[data-live="art"]');
const notesLayer = svg.querySelector('[data-live="notes"]');
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
let clock = still.matches ? 4.4 : 0.6;
let paused = still.matches;
let visible = false;
let frame = 0;
let last = 0;

function draw() {
  const view = sarcomereSvg(still.matches ? Math.floor(clock * 4) / 4 + 0.001 : clock, P, B, DATA);
  artLayer.innerHTML = view.art;
  notesLayer.innerHTML = view.annotations;
  const text = readoutOf(clock);
  if (readout.textContent !== text) readout.textContent = text;
  stage.setAttribute("aria-valuenow", String(Math.round(bandsAt(clock).sl * 100)));
  stage.setAttribute("aria-valuetext", text);
}
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  if (!paused) clock = (clock + dt) % CYCLE_S;
  draw();
  frame = visible && !paused ? requestAnimationFrame(tick) : 0;
}
const run = () => {
  if (!frame && visible && !paused) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
};
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  run();
}, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("keydown", (event) => {
  if (event.key === "ArrowRight") {
    event.preventDefault();
    const t = ((clock % CYCLE_S) + CYCLE_S) % CYCLE_S;
    clock = t < 1.2 || t >= 5.2 ? 1.2 : 5.2;
    draw();
  } else if (event.key === " ") {
    event.preventDefault();
    paused = !paused;
    run();
  }
});
draw();
</script></body></html>
