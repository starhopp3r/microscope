name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Rebuild the examples
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Regression tests
        run: |
          test_deps="$(mktemp -d)"
          trap 'rm -rf "$test_deps"' EXIT
          npm install --prefix "$test_deps" --no-audit --no-fund --ignore-scripts react@19.3.0 react-dom@19.3.0 typescript@5.9.3 esbuild@0.28.2
          NODE_PATH="$test_deps/node_modules" node --test scripts/*.test.mjs

      - name: ATP synthase
        run: |
          node examples/atp-synthase/build.mjs
          node examples/atp-synthase/build.mjs --light

      - name: DNA double helix
        run: |
          node examples/dna-double-helix/build.mjs
          node examples/dna-double-helix/build.mjs --light

      - name: Bacteriophage T4
        run: |
          node examples/t4-phage/build.mjs
          node examples/t4-phage/build.mjs --light

      - name: Leaf and stoma
        run: |
          node examples/leaf-stoma/build.mjs
          node examples/leaf-stoma/build.mjs --light

      - name: Sarcomere
        run: |
          node examples/sarcomere/build.mjs
          node examples/sarcomere/build.mjs --light

      - name: Committed pages are unchanged
        run: |
          git status --short
          git diff --stat --exit-code
          test -z "$(git status --porcelain)"
