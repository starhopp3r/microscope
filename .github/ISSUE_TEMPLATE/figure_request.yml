name: Figure or feature request
description: Ask for a new example figure, a new part or helper in the kit, a new check, or a change to how the skill works.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Microscope draws a biological structure or process as an interactive, textbook-quality figure: molecules, cells, microbes, plants, animals and the lab techniques that study them. It is not a chart library or a molecular viewer, and it does not draw whole people or exact maps.
  - type: dropdown
    id: request
    attributes:
      label: What are you asking for?
      options:
        - A new example figure
        - A new part or helper in the kit
        - A new check or script
        - A change to the skill's instructions
        - Something else
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: For a figure, name the structure or process, the organism, and its real numbers (sizes, counts, stoichiometry, rates), or the specimen you have in mind and what should move. For anything else, describe the change.
      placeholder: Kinesin-1 walking along a microtubule in a neuron, 8 nm per step and one ATP per step, carrying a vesicle toward the plus end.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of figure
      options:
        - SVG
        - SVG + WebGL
        - 3D (beta)
        - Not sure
        - Not about a figure
  - type: textarea
    id: why
    attributes:
      label: Why it is worth adding
      description: What it would teach, or what you could not do without it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues.
          required: true
        - label: I read the Limits section of the README.
          required: true
